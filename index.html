<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reaction Time Test</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">

        <h1>Reaction Time Test</h1>

        <div id="game-area">
            Klik untuk mulai
        </div>

        <div id="stats">

            <div class="card">
                <h2>Last Reaction</h2>
                <p id="last-time">0 ms</p>
            </div>

            <div class="card">
                <h2>Best Record</h2>
                <p id="best-time">0 ms</p>
            </div>

        </div>

        <p id="result">
            Hasil akan muncul di sini
        </p>

        <button id="reset-btn">
            Reset
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
